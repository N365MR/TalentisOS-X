<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070A0F">
  <title>TalentisOS-X</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><div class="brand-mark">T</div><div><strong>TalentisOS-X</strong><span>Daily leadership playbook</span></div></div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer"><div class="privacy-dot"></div><span>Local-first &amp; private</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><button id="mobile-menu" class="icon-button" aria-label="Open navigation">☰</button><div class="eyebrow" id="breadcrumb">COMMAND CENTRE</div><div class="topbar-actions"><span class="date-pill" id="today-date"></span><button class="avatar" aria-label="Profile">AL</button></div></header>
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>
  <button id="help-button" class="help-button" aria-label="Open user guide">?</button>
  <button id="scroll-top" hidden aria-label="Scroll to top"></button>
  <button id="scroll-bottom" hidden aria-label="Scroll to bottom"></button>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
